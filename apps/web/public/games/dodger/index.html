<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dodger: Hippo Siege</title>
    <style>
      body {
        margin: 0;
        background:
          radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.2), transparent 30%),
          radial-gradient(circle at 85% 20%, rgba(244, 114, 182, 0.22), transparent 36%),
          linear-gradient(180deg, #0b1020, #0f172a);
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        margin: 0 auto;
        background: radial-gradient(circle at top, #18243f, #0e1529 70%);
        border: 1px solid #475569;
        border-radius: 12px;
        box-shadow: 0 14px 34px rgba(2, 6, 23, 0.5);
      }
      p {
        text-align: center;
        margin: 10px;
        color: #bfdbfe;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .controls {
        text-align: center;
        margin: 0 10px 14px;
      }
      .controls label {
        font-size: 14px;
        color: #cbd5e1;
      }
      .controls select {
        margin-left: 8px;
        background: #111827;
        color: #e2e8f0;
        border: 1px solid #475569;
        border-radius: 8px;
        padding: 5px 8px;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="800" height="480"></canvas>
    <div class="controls">
      <label for="ship-select">Ship style</label>
      <select id="ship-select"></select>
    </div>
    <p>Use ← and → to dodge. Survive 40s per level. 3 pellet hits = defeat.</p>
    <script>
      function initialEnemyShotCooldownRange(level) {
        return level >= 3 ? { min: 6, max: 22 } : { min: 50, max: 130 };
      }

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const shipSelect = document.getElementById('ship-select');
      const LEVEL_SECONDS = 40;
      const player = { x: 380, y: 430, w: 44, h: 24, speed: 7, hp: 3 };
      const keys = { left: false, right: false };
      const enemies = [];
      const pellets = [];
      let boss = null;
      let frame = 0;
      let level = 1;
      let timeLeft = LEVEL_SECONDS;
      let timerAccum = 0;
      let score = 0;
      let levelBanner = 150;
      let winBanner = 0;

      const enemyThemes = ['asteroid', 'planet', 'star'];
      const shipTypes = [
        { id: 'scout', label: 'Scout (Narrow)', w: 36, h: 20, speed: 7.6 },
        { id: 'fighter', label: 'Fighter (Balanced)', w: 44, h: 24, speed: 7 },
        { id: 'enterprise', label: 'Explorer Cruiser (Wide)', w: 62, h: 24, speed: 6.5 },
      ];
      const spriteCache = new Map();
      const MAX_ENEMY_PELLETS = 18;
      function maxEnemyPelletsForLevel(currentLevel) {
        return Math.max(1, Math.floor(MAX_ENEMY_PELLETS / 5));
      }

      function setPlayerShip(ship) {
        player.w = ship.w;
        player.h = ship.h;
        player.speed = ship.speed;
        player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
      }

      function initializeShipPicker() {
        for (const ship of shipTypes) {
          const option = document.createElement('option');
          option.value = ship.id;
          option.textContent = ship.label;
          shipSelect.append(option);
        }

        shipSelect.value = 'fighter';
        setPlayerShip(shipTypes.find((ship) => ship.id === shipSelect.value));

        shipSelect.addEventListener('change', () => {
          const nextShip = shipTypes.find((ship) => ship.id === shipSelect.value);
          if (nextShip) setPlayerShip(nextShip);
        });
      }

      document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') keys.left = true; if (e.key === 'ArrowRight') keys.right = true; });
      document.addEventListener('keyup', (e) => { if (e.key === 'ArrowLeft') keys.left = false; if (e.key === 'ArrowRight') keys.right = false; });

      function rand(min, max) { return min + Math.random() * (max - min); }
      function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
      function intersects(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

      function createSprite(key, width, height, drawFn) {
        const cached = spriteCache.get(key);
        if (cached) return cached;
        const sprite = document.createElement('canvas');
        sprite.width = width;
        sprite.height = height;
        const spriteCtx = sprite.getContext('2d');
        drawFn(spriteCtx, width, height);
        spriteCache.set(key, sprite);
        return sprite;
      }

      function getEnemySprite(theme) {
        if (theme === 'asteroid') {
          return createSprite('enemy-asteroid', 64, 64, (sctx, w, h) => {
            sctx.fillStyle = '#9ca3af';
            sctx.beginPath();
            sctx.moveTo(w * 0.2, h * 0.15);
            sctx.lineTo(w * 0.75, h * 0.1);
            sctx.lineTo(w * 0.9, h * 0.45);
            sctx.lineTo(w * 0.7, h * 0.85);
            sctx.lineTo(w * 0.25, h * 0.8);
            sctx.lineTo(w * 0.08, h * 0.45);
            sctx.closePath();
            sctx.fill();
            sctx.fillStyle = '#6b7280';
            sctx.beginPath(); sctx.arc(w * 0.35, h * 0.38, 7, 0, Math.PI * 2); sctx.fill();
            sctx.beginPath(); sctx.arc(w * 0.62, h * 0.58, 8, 0, Math.PI * 2); sctx.fill();
          });
        }
        if (theme === 'planet') {
          return createSprite('enemy-planet', 64, 64, (sctx, w, h) => {
            const grad = sctx.createRadialGradient(w * 0.32, h * 0.3, 4, w * 0.5, h * 0.5, w * 0.45);
            grad.addColorStop(0, '#fde68a');
            grad.addColorStop(1, '#f97316');
            sctx.fillStyle = grad;
            sctx.beginPath(); sctx.arc(w / 2, h / 2, w * 0.35, 0, Math.PI * 2); sctx.fill();
            sctx.strokeStyle = '#fdba74';
            sctx.lineWidth = 4;
            sctx.beginPath();
            sctx.ellipse(w / 2, h / 2, w * 0.46, h * 0.14, -0.35, 0, Math.PI * 2);
            sctx.stroke();
          });
        }
        return createSprite('enemy-star', 64, 64, (sctx, w, h) => {
          sctx.fillStyle = '#fef08a';
          sctx.beginPath();
          for (let i = 0; i < 10; i += 1) {
            const angle = -Math.PI / 2 + (i * Math.PI) / 5;
            const r = i % 2 === 0 ? w * 0.38 : w * 0.16;
            const px = w * 0.5 + Math.cos(angle) * r;
            const py = h * 0.5 + Math.sin(angle) * r;
            if (i === 0) sctx.moveTo(px, py); else sctx.lineTo(px, py);
          }
          sctx.closePath();
          sctx.fill();
          sctx.fillStyle = 'rgba(254,240,138,0.35)';
          sctx.beginPath(); sctx.arc(w * 0.5, h * 0.5, w * 0.46, 0, Math.PI * 2); sctx.fill();
        });
      }

      function getShipSprite(shipType) {
        return createSprite(`ship-${shipType.id}`, shipType.w * 2, shipType.h * 2, (sctx, w, h) => {
          if (shipType.id === 'enterprise') {
            sctx.fillStyle = '#cbd5e1';
            sctx.fillRect(w * 0.2, h * 0.55, w * 0.6, h * 0.2);
            sctx.fillRect(w * 0.42, h * 0.25, w * 0.16, h * 0.36);
            sctx.fillStyle = '#94a3b8';
            sctx.fillRect(w * 0.1, h * 0.6, w * 0.18, h * 0.18);
            sctx.fillRect(w * 0.72, h * 0.6, w * 0.18, h * 0.18);
          } else {
            const base = shipType.id === 'scout' ? '#22d3ee' : '#60a5fa';
            const accent = shipType.id === 'scout' ? '#0891b2' : '#1d4ed8';
            sctx.fillStyle = base;
            sctx.beginPath();
            sctx.moveTo(w * 0.5, h * 0.12);
            sctx.lineTo(w * 0.84, h * 0.84);
            sctx.lineTo(w * 0.16, h * 0.84);
            sctx.closePath();
            sctx.fill();
            sctx.fillStyle = accent;
            sctx.fillRect(w * 0.44, h * 0.36, w * 0.12, h * 0.38);
          }
        });
      }

      function resetRun() {
        level = 1; timeLeft = LEVEL_SECONDS; timerAccum = 0; frame = 0; score = 0;
        player.x = 380; player.hp = 3; enemies.length = 0; pellets.length = 0; boss = null; levelBanner = 200;
      }
      function startNextLevel() {
        level += 1;
        if (level > 5) { winBanner = 360; resetRun(); return; }
        timeLeft = LEVEL_SECONDS; timerAccum = 0; enemies.length = 0; pellets.length = 0; boss = null; player.hp = 3; levelBanner = 200;
      }

      function spawnEnemy() {
        const baseW = rand(20, 36);
        const baseH = rand(20, 36);
        const progress = 1 - (timeLeft / LEVEL_SECONDS);
        const initialShotCooldown = initialEnemyShotCooldownRange(level);
        let e = { x: rand(0, canvas.width - baseW), y: -baseH - 4, w: baseW, h: baseH, vx: 0, vy: rand(1.8, 3.2), theme: pick(enemyThemes), shotCd: rand(initialShotCooldown.min, initialShotCooldown.max) };

        if (level >= 2) {
          const medianBoost = progress * 2.4;
          e.vy = rand(2.0 + medianBoost, 5.2 + medianBoost);
        }
        if (level >= 4 && Math.random() < 0.45) {
          const fromLeft = Math.random() < 0.5;
          e.x = fromLeft ? -baseW : canvas.width + baseW;
          e.y = rand(-baseH - 8, canvas.height * 0.18);
          e.vx = fromLeft ? rand(1.0, 2.8) : -rand(1.0, 2.8);
          e.vy = rand(1.2, 2.6);
        }
        enemies.push(e);
      }

      function spawnPopcorn(shooter, aimed) {
        const cx = shooter.x + shooter.w / 2;
        const cy = shooter.y + shooter.h / 2;
        let vx = rand(-1.8, 1.8), vy = rand(2.8, 4.8);
        if (aimed) {
          const dx = (player.x + player.w / 2) - cx;
          const dy = (player.y + player.h / 2) - cy;
          const mag = Math.hypot(dx, dy) || 1;
          vx = (dx / mag) * rand(2.8, 3.8);
          vy = (dy / mag) * rand(2.8, 3.8);
        }
        pellets.push({ x: cx, y: cy, w: 8, h: 8, vx, vy, life: 240 });
      }

      function ensureBoss() {
        if (level !== 5 || boss) return;
        boss = { x: canvas.width / 2 - 80, y: 28, w: 160, h: 88, vx: 3.4, fireCd: 18 };
      }

      function update(dt) {
        frame += 1;
        timerAccum += dt;
        if (timerAccum >= 1) { timerAccum -= 1; timeLeft -= 1; }
        if (timeLeft <= 0) { startNextLevel(); return; }

        if (keys.left) player.x -= player.speed;
        if (keys.right) player.x += player.speed;
        player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

        const spawnRate = Math.max(5, 22 - level * 3);
        if (frame % spawnRate === 0) spawnEnemy();
        ensureBoss();

        for (const e of enemies) {
          e.x += e.vx;
          e.y += e.vy;
          if (level >= 3) {
            e.shotCd -= 1;
            const inTopBand = e.y < canvas.height * 0.15;
            const canShoot = inTopBand && pellets.length < maxEnemyPelletsForLevel(level);
            if (e.shotCd <= 0 && canShoot) {
              spawnPopcorn(e, Math.random() < 0.7);
              e.shotCd = rand(6, 22);
            }
          }
          if (intersects(player, e)) { alert('You got crushed! Restarting at level 1.'); resetRun(); return; }
        }

        if (boss) {
          boss.x += boss.vx;
          if (boss.x < 20 || boss.x + boss.w > canvas.width - 20) boss.vx *= -1;
          boss.fireCd -= 1;
          if (boss.fireCd <= 0) {
            const pelletCap = maxEnemyPelletsForLevel(level);
            if (pellets.length < pelletCap) spawnPopcorn(boss, Math.random() < 0.85);
            if (Math.random() < 0.7 && pellets.length < pelletCap) spawnPopcorn(boss, false);
            if (Math.random() < 0.35 && pellets.length < pelletCap) spawnPopcorn(boss, true);
            boss.fireCd = rand(8, 16);
          }
          if (intersects(player, boss)) { alert('Hippo stomped you! Restarting at level 1.'); resetRun(); return; }
        }

        for (const p of pellets) {
          p.x += p.vx; p.y += p.vy; p.life -= 1;
          if (intersects(player, p)) {
            player.hp -= 1; p.life = 0;
            if (player.hp <= 0) { alert('Popcorn barrage got you! Restarting at level 1.'); resetRun(); return; }
          }
        }

        for (let i = enemies.length - 1; i >= 0; i -= 1) {
          const e = enemies[i];
          if (e.y > canvas.height + 60 || e.x < -80 || e.x > canvas.width + 80 || e.y < -80) {
            enemies.splice(i, 1); score += 1;
          }
        }
        for (let i = pellets.length - 1; i >= 0; i -= 1) {
          const p = pellets[i];
          if (p.life <= 0 || p.y > canvas.height + 20 || p.x < -20 || p.x > canvas.width + 20 || p.y < -20) pellets.splice(i, 1);
        }
      }

      function drawEnemy(e) {
        const sprite = getEnemySprite(e.theme);
        ctx.drawImage(sprite, e.x, e.y, e.w, e.h);
      }

      function drawShip() {
        const currentShip = shipTypes.find((ship) => ship.id === shipSelect.value) ?? shipTypes[1];
        const sprite = getShipSprite(currentShip);
        ctx.drawImage(sprite, player.x, player.y, player.w, player.h);
      }

      function drawHippo(h) {
        ctx.fillStyle = '#a78bfa';
        ctx.fillRect(h.x + 10, h.y + 18, h.w - 20, h.h - 20);
        ctx.fillStyle = '#8b5cf6';
        ctx.fillRect(h.x + 20, h.y + 42, h.w - 40, h.h - 16);
        ctx.fillStyle = '#ddd6fe';
        ctx.fillRect(h.x + 40, h.y + 62, h.w - 80, 10);
        ctx.fillStyle = '#111827';
        ctx.beginPath(); ctx.arc(h.x + 48, h.y + 38, 5, 0, Math.PI * 2); ctx.arc(h.x + h.w - 48, h.y + 38, 5, 0, Math.PI * 2); ctx.fill();
      }

      function drawPopcorn(p) {
        ctx.fillStyle = '#fde68a';
        ctx.beginPath();
        ctx.moveTo(p.x + 4, p.y);
        ctx.quadraticCurveTo(p.x + 8, p.y + 2, p.x + 7, p.y + 6);
        ctx.quadraticCurveTo(p.x + 4, p.y + 8, p.x + 1, p.y + 6);
        ctx.quadraticCurveTo(p.x, p.y + 2, p.x + 4, p.y);
        ctx.fill();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawShip();

        for (const e of enemies) drawEnemy(e);
        for (const p of pellets) drawPopcorn(p);
        if (boss) drawHippo(boss);

        ctx.fillStyle = '#e2e8f0';
        ctx.font = '16px system-ui';
        ctx.fillText(`Level: ${level}/5`, 14, 24);
        ctx.fillText(`Time: ${String(timeLeft).padStart(2, '0')}s`, 130, 24);
        ctx.fillText(`Score: ${score}`, 230, 24);
        ctx.fillText(`HP: ${player.hp}`, 320, 24);
        if (levelBanner > 0) {
          levelBanner -= 1;
          ctx.fillStyle = 'rgba(191,219,254,0.95)';
          ctx.font = 'bold 34px system-ui';
          ctx.fillText(`LEVEL ${level}`, canvas.width / 2 - 90, canvas.height / 2);
        }
        if (winBanner > 0) {
          winBanner -= 1;
          ctx.fillStyle = 'rgba(255,255,255,0.95)';
          ctx.font = 'bold 82px system-ui';
          ctx.fillText('Congratulations', 70, canvas.height / 2 + 10);
        }
      }

      initializeShipPicker();
      let last = performance.now();
      function loop(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      loop(last);
    </script>
  </body>
</html>
